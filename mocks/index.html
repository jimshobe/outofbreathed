<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>outofbreathed.com</title>
<link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<style>
:root {
  --bg: #000;
  --fg: #f2f2f2;
  --dim: #7a7a7a;
  --faint: #2a2a2a;
  --mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.5 var(--mono); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
a { color: inherit; }

header { position: fixed; inset: 0 0 auto; z-index: 10; display: flex; justify-content: space-between; align-items: baseline; padding: max(16px, env(safe-area-inset-top)) 20px 16px; pointer-events: none; }
header > * { pointer-events: auto; }
h1 { font: 500 15px/1 var(--mono); letter-spacing: 0; }
nav { display: flex; gap: 18px; }
nav button { color: var(--dim); }
nav button:hover { color: var(--fg); }
nav .on { color: var(--fg); }
nav .on::before { content: '['; } nav .on::after { content: ']'; }

/* timeline: a full-screen scroll layer over the map, so the map keeps its state */
#timeline { position: fixed; inset: 0; z-index: 8; overflow-y: auto; background: var(--bg); padding: 60px 20px 90px; }
#timeline[hidden] { display: none; }
.tl { max-width: 640px; margin: 0 auto; }
.filters { position: sticky; top: -4px; z-index: 2; margin: 0 -20px; padding: 14px 20px 14px; background: linear-gradient(#000 85%, #0000); display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--dim); }
.filters button { color: var(--dim); }
.filters button:hover { color: var(--fg); }
.filters button.on { color: var(--fg); }
.filters button.on::before { content: '['; } .filters button.on::after { content: ']'; }
.mh { display: flex; align-items: center; gap: 10px; margin: 44px 0 18px; color: var(--dim); white-space: nowrap; }
.mh::before { content: '──'; color: var(--faint); }
.mh::after { content: ''; flex: 1; border-top: 1px solid var(--faint); }
.mh b { color: var(--fg); font-weight: 400; }
.mo { margin-bottom: 40px; scroll-margin-top: 110px; }
.mo .media { display: block; width: 100%; background: #0d0d0d; overflow: hidden; cursor: zoom-in; }
.mo .media img, .mo .media video { width: 100%; height: 100%; object-fit: cover; display: block; }
.mo .line { margin-top: 10px; display: grid; grid-template-columns: 64px minmax(0, max-content) 1fr; gap: 0 14px; align-items: baseline; }
.mo .d { color: var(--dim); }
.mo .pl { max-width: 200px; color: var(--dim); text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 3px; }
.mo .pl:hover { color: var(--fg); text-decoration-color: var(--fg); }
.mo .c { color: var(--fg); }
.mo .t { color: var(--dim); margin-left: 8px; }
.mo.flash .media { outline: 1px solid var(--fg); outline-offset: 4px; }
.tl .end { margin-top: 60px; color: var(--dim); }
.tl .end::before { content: '$ '; }
.tl .end i { display: inline-block; width: 8px; height: 15px; background: var(--fg); vertical-align: -2px; margin-left: 2px; animation: blink 1.1s steps(1) infinite; }
.panel ol li span:first-child { cursor: pointer; text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 3px; }
.panel ol li span:first-child:hover { color: var(--fg); }
body.tl-on footer { display: none; }
body.tl-on header { background: #000; }

#map { position: fixed; inset: 0; }
.maplibregl-ctrl-top-right { top: 40px; }
.maplibregl-ctrl-attrib { background: #000 !important; color: #555; font: 10px var(--mono); }
.maplibregl-ctrl-attrib a { color: #555 !important; }
.maplibregl-ctrl-attrib-button { filter: invert(1) brightness(.4); }

/* place markers, drawn as an overlay we position ourselves */
#marks { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
.mk { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; cursor: pointer; display: flex; align-items: center; gap: 8px; white-space: nowrap; transition: opacity .2s; }
.mk .sq { width: 7px; height: 7px; background: var(--fg); flex: none; }
.mk.approx .sq { background: transparent; outline: 1px dashed var(--fg); outline-offset: 1px; }
.mk .n { color: var(--fg); }
.mk .lbl { color: var(--dim); opacity: 0; transition: opacity .2s; display: flex; gap: 8px; align-items: center; }
.mk .lbl .nm:hover { color: var(--fg); }
.mk .i { color: var(--dim); }
.mk .i:hover { color: var(--fg); }
.mk:hover .lbl, .labels .mk:not(.nolabel) .lbl { opacity: 1; }
.mk:hover .sq { box-shadow: 0 0 0 3px #000, 0 0 0 4px var(--fg); }
.mk.group { transform: translate(-50%, -50%); }
.mk.group .n { padding: 2px 4px; background: #000; outline: 1px solid var(--fg); }
.mk.group:hover .n { background: var(--fg); color: #000; }
.mk.here .sq { animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* place panel */
.panel { position: fixed; z-index: 20; right: 20px; top: 56px; bottom: 56px; width: min(420px, calc(100% - 40px)); background: #000; outline: 1px solid var(--faint); padding: 18px; overflow: auto; display: none; scrollbar-width: none; }
.panel.open { display: block; }
.panel .cmd { color: var(--dim); }
.panel .cmd b { color: var(--fg); font-weight: 500; }
.panel .sub { color: var(--dim); margin-top: 2px; }
.panel .blurb { margin-top: 16px; color: #cfcfcf; }
.panel .src { margin-top: 6px; color: var(--dim); }
.panel .grid { margin-top: 18px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.panel .grid button { position: relative; aspect-ratio: 1; background: #111; overflow: hidden; }
.panel .grid img, .panel .grid video { width: 100%; height: 100%; object-fit: cover; display: block; filter: grayscale(.25); transition: filter .2s; }
.panel .grid button:hover img, .panel .grid button:hover video { filter: none; }
.panel .grid .p { position: absolute; left: 4px; bottom: 4px; font-size: 10px; background: #000; padding: 0 3px; }
.panel ol { list-style: none; padding: 0; margin-top: 16px; color: var(--dim); }
.panel ol li { display: grid; grid-template-columns: 62px 1fr; gap: 8px; }
.panel ol li span:last-child { color: #cfcfcf; }
.panel .x { position: absolute; top: 14px; right: 16px; color: var(--dim); }
.panel .x:hover { color: var(--fg); }
.panel .note { margin-top: 14px; color: var(--dim); }
.panel .tabs { margin-top: 14px; display: flex; gap: 16px; color: var(--dim); }
.panel .tabs button { color: var(--dim); }
.panel .tabs button:hover, .panel .tabs .on { color: var(--fg); }
.panel .tabs .on::before { content: '['; } .panel .tabs .on::after { content: ']'; }
.panel .tabs .on[data-mode="info"]::before, .panel .tabs .on[data-mode="info"]::after { content: ''; }
.panel .desc { margin-top: 16px; color: var(--dim); }
.panel .desc + .blurb { margin-top: 8px; }
.panel a.src { display: inline-block; text-decoration: none; }
.panel a.src:hover { color: var(--fg); }
.panel .grid.big { grid-template-columns: repeat(2, 1fr); }
.panel .loading { margin-top: 18px; color: var(--dim); }
.panel .loading i { display: inline-block; width: 7px; height: 13px; background: var(--fg); vertical-align: -2px; margin-left: 4px; animation: blink 1.1s steps(1) infinite; }

/* status line */
footer { position: fixed; inset: auto 0 0; z-index: 10; display: flex; justify-content: flex-end; gap: 16px; padding: 14px 20px max(14px, env(safe-area-inset-bottom)); color: var(--dim); pointer-events: none; }
footer > * { pointer-events: auto; }
footer .keys button { color: var(--dim); margin-left: 14px; }
footer .keys button:hover, footer .keys button.on { color: var(--fg); }
footer .keys b { color: var(--fg); font-weight: 400; }

/* lightbox */
.lb { position: fixed; inset: 0; z-index: 100; background: #000; display: grid; grid-template-columns: 56px 1fr 56px; grid-template-rows: 1fr auto; opacity: 0; pointer-events: none; transition: opacity .15s; }
.lb.open { opacity: 1; pointer-events: auto; }
.lb-stage { grid-column: 2; display: grid; place-items: center; min-height: 0; padding-top: 48px; }
.lb-media { max-width: 100%; max-height: calc(100dvh - 130px); object-fit: contain; }
.lb-prev, .lb-next { grid-row: 1; color: var(--dim); font-size: 20px; }
.lb-prev { grid-column: 1; } .lb-next { grid-column: 3; }
.lb-prev:hover, .lb-next:hover, .lb-close:hover { color: var(--fg); }
.lb-close { position: absolute; top: 16px; right: 20px; z-index: 2; color: var(--dim); font-size: 13px; }
.lb-close::before { content: '[esc] '; }
.lb-meta { grid-column: 1 / -1; padding: 14px 20px 22px; display: flex; justify-content: space-between; gap: 16px; }
.lb-meta .m { color: var(--dim); white-space: nowrap; }

@media (max-width: 700px) {
  #timeline { padding: 56px 16px 80px; }
  .filters { margin: 0 -16px; padding: 12px 16px 12px; }
  .mo .line { grid-template-columns: auto 1fr; gap: 2px 12px; }
  .mo .c { grid-column: 1 / -1; }
  header { padding: max(14px, env(safe-area-inset-top)) 16px 12px; }
  .panel { inset: auto 0 0 0; top: auto; width: 100%; max-height: 62%; outline: 0; border-top: 1px solid var(--faint); padding: 16px 16px max(16px, env(safe-area-inset-bottom)); }
  footer { padding: 12px 16px max(12px, env(safe-area-inset-bottom)); flex-direction: column; gap: 6px; }
  footer .keys button:first-child { margin-left: 0; }
  .lb { grid-template-columns: 0 1fr 0; }
  .lb-prev, .lb-next { display: none; }
  .lb-meta { flex-direction: column; gap: 4px; }
}
</style>
</head>
<body>

<header>
  <h1>outofbreathed.com</h1>
  <nav><button data-view="timeline">timeline</button><button data-view="map" class="on">map</button></nav>
</header>

<div id="map"></div>
<section id="timeline" hidden><div class="tl"><div class="filters" id="filters"></div><div id="tl"></div></div></section>
<div id="marks"></div>
<aside class="panel" id="panel"></aside>

<footer>
  <div class="keys">
    <button data-k="n"><b>n</b> newest</button>
    <button data-k="w"><b>w</b> world</button>
    <button data-k="r"><b>r</b> spin</button>
  </div>
</footer>

<script src="shared.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const groups = placeGroups(MOMENTS);
const placeKeys = Object.keys(groups);
const latest = MOMENTS[0];


// Globe zooms are tuned for a ~900px tall window; scale so the globe fits any screen.
const fit = Math.log2(Math.min(innerWidth * 1.15, innerHeight) / 900);
const VIEWS = {
  start: { center: [138, -24], zoom: 2.25 + fit },
  n: { center: [latest.place.lng, latest.place.lat], zoom: 9 },
  w: { center: [-168, 10], zoom: 1.6 + fit },
};

function graticule(step = 30) {
  const lines = [];
  for (let lng = -180; lng < 180; lng += step) lines.push(Array.from({ length: 33 }, (_, i) => [lng, -80 + i * 5]));
  for (let lat = -60; lat <= 60; lat += step) lines.push(Array.from({ length: 73 }, (_, i) => [-180 + i * 5, lat]));
  return { type: 'Feature', geometry: { type: 'MultiLineString', coordinates: lines } };
}

const map = new maplibregl.Map({
  container: 'map',
  center: VIEWS.start.center, zoom: VIEWS.start.zoom,
  attributionControl: false,
  style: {
    version: 8,
    projection: { type: 'globe' },
    sources: {
      land: { type: 'geojson', data: new URL('data/land-50m.geojson', location.href).href, attribution: 'Natural Earth' },
      omt: { type: 'vector', url: 'https://tiles.openfreemap.org/planet' },
      grat: { type: 'geojson', data: graticule() },
      route: { type: 'geojson', data: { type: 'Feature', geometry: { type: 'LineString', coordinates: RIDE_ROUTE } } },
    },
    layers: [
      { id: 'bg', type: 'background', paint: { 'background-color': '#080808' } },
      { id: 'grat', type: 'line', source: 'grat', paint: { 'line-color': '#1c1c1c', 'line-width': 1 } },
      { id: 'land', type: 'fill', source: 'land', paint: { 'fill-color': '#161616', 'fill-opacity': ['interpolate', ['linear'], ['zoom'], 4, 1, 6, 0] } },
      { id: 'coast', type: 'line', source: 'land', paint: { 'line-color': '#777', 'line-width': 0.7, 'line-opacity': ['interpolate', ['linear'], ['zoom'], 4, 1, 6, 0] } },
      // Up close, switch to detailed vector tiles: land as dark fill, water cut out of it.
      { id: 'd-land', type: 'background', minzoom: 4, paint: { 'background-color': '#161616', 'background-opacity': ['interpolate', ['linear'], ['zoom'], 4, 0, 6, 1] } },
      { id: 'd-water', type: 'fill', source: 'omt', 'source-layer': 'water', minzoom: 4, paint: { 'fill-color': '#080808', 'fill-opacity': ['interpolate', ['linear'], ['zoom'], 4, 0, 6, 1] } },
      { id: 'd-water-edge', type: 'line', source: 'omt', 'source-layer': 'water', minzoom: 5, filter: ['!=', ['get', 'class'], 'ocean'], paint: { 'line-color': '#333', 'line-width': 0.5 } },
      { id: 'd-park', type: 'fill', source: 'omt', 'source-layer': 'park', minzoom: 7, paint: { 'fill-color': '#111', 'fill-outline-color': '#1c1c1c' } },
      { id: 'd-roads', type: 'line', source: 'omt', 'source-layer': 'transportation', minzoom: 7,
        filter: ['in', ['get', 'class'], ['literal', ['motorway', 'trunk', 'primary', 'secondary', 'tertiary']]],
        paint: { 'line-color': '#262626', 'line-width': ['interpolate', ['linear'], ['zoom'], 7, 0.4, 12, 1.4] } },
      { id: 'd-coast', type: 'line', source: 'omt', 'source-layer': 'water', minzoom: 5, filter: ['==', ['get', 'class'], 'ocean'],
        paint: { 'line-color': '#5a5a5a', 'line-width': 0.7, 'line-opacity': ['interpolate', ['linear'], ['zoom'], 5, 0, 6, 1] } },
      { id: 'route', type: 'line', source: 'route', minzoom: 6, paint: { 'line-color': '#f2f2f2', 'line-width': 1.2, 'line-dasharray': [1, 2] } },
    ],
  },
});

// Faint atmosphere at globe zoom, gone when close.
map.addControl(new maplibregl.AttributionControl({ compact: true }), 'top-right');
map.on('load', () => document.querySelector('.maplibregl-ctrl-attrib')?.classList.remove('maplibregl-compact-show'));
map.on('load', () => map.setSky({ 'atmosphere-blend': ['interpolate', ['linear'], ['zoom'], 0, 0.35, 4, 0] }));

// ---- marker overlay: places grouped by on-screen distance ----
const marks = $('#marks');
const DEG = Math.PI / 180;
function visible(lng, lat) {
  // Hide points on the far side of the globe.
  const c = map.getCenter();
  const cos = Math.sin(lat * DEG) * Math.sin(c.lat * DEG) + Math.cos(lat * DEG) * Math.cos(c.lat * DEG) * Math.cos((lng - c.lng) * DEG);
  return map.getZoom() > 5 || cos > 0.12;
}
function drawMarks() {
  const z = map.getZoom();
  const pts = placeKeys
    .map((k) => ({ k, g: groups[k], p: map.project([groups[k].place.lng, groups[k].place.lat]) }))
    .filter((o) => visible(o.g.place.lng, o.g.place.lat))
    .sort((a, b) => b.g.items.length - a.g.items.length);
  const clusters = [];
  for (const o of pts) {
    const c = clusters.find((c) => Math.hypot(c.p.x - o.p.x, c.p.y - o.p.y) < 34);
    if (c) c.members.push(o); else clusters.push({ p: o.p, members: [o] });
  }
  marks.classList.toggle('labels', z > 7.5);
  // Show a label only if it doesn't collide with one already placed (biggest places win).
  const placed = [];
  for (const c of clusters) {
    if (c.members.length > 1) { placed.push({ x0: c.p.x - 16, x1: c.p.x + 16, y0: c.p.y - 12, y1: c.p.y + 12 }); continue; }
    const g = c.members[0].g, w = (g.place.name.length + 7) * 7.8 + 24;
    const box = { x0: c.p.x - 6, x1: c.p.x + w, y0: c.p.y - 10, y1: c.p.y + 10 };
    c.nolabel = placed.some((b) => box.x0 < b.x1 && box.x1 > b.x0 && box.y0 < b.y1 && box.y1 > b.y0);
    placed.push(c.nolabel ? { x0: c.p.x - 6, x1: c.p.x + 6, y0: c.p.y - 6, y1: c.p.y + 6 } : box);
  }
  marks.innerHTML = clusters.map((c) => {
    const n = c.members.reduce((s, o) => s + o.g.items.length, 0);
    const style = `left:${c.p.x}px;top:${c.p.y}px`;
    if (c.members.length > 1) {
      return `<div class="mk group" style="${style}" data-keys="${c.members.map((o) => o.k).join(',')}"><span class="n">${n}</span></div>`;
    }
    const o = c.members[0];
    const here = o.k === latest.placeKey ? ' here' : '';
    return `<div class="mk${o.g.place.zone ? ' approx' : ''}${here}${c.nolabel ? ' nolabel' : ''}" style="${style}" data-keys="${o.k}">
      <span class="sq"></span><span class="lbl"><span class="nm">${o.g.place.name.toLowerCase()} ${n}</span><button class="i" data-info="${o.k}" aria-label="About ${o.g.place.name}">[i]</button></span></div>`;
  }).join('');
}
map.on('render', drawMarks);

marks.addEventListener('click', (e) => {
  const mk = e.target.closest('.mk'); if (!mk) return;
  stopSpin();
  const info = e.target.closest('[data-info]');
  if (info) return openInfo(info.dataset.info);
  const keys = mk.dataset.keys.split(',');
  if (keys.length > 1) {
    const b = new maplibregl.LngLatBounds();
    keys.forEach((k) => b.extend([groups[k].place.lng, groups[k].place.lat]));
    map.fitBounds(b, { padding: 120, maxZoom: 11, duration: 1800 });
  } else {
    openPhotos(keys[0]);
  }
});

// ---- place panel: my photos, or "about" from Wikipedia ----
const lbMeta = (m, i, n) => `<span>${m.caption}</span><span class="m">${m.credit || `${fmtDay(m.date).toLowerCase()} · ${m.place.name.toLowerCase()}`} · ${i + 1}/${n}</span>`;

function flyToPlace(pl) {
  const zoom = Math.max(map.getZoom(), 9);
  const offset = window.innerWidth > 700 ? [-200, 0] : [0, -window.innerHeight * 0.25];
  map.flyTo({ center: [pl.lng, pl.lat], zoom, offset, duration: map.getZoom() < 5 ? 3000 : 1200 });
}

function panelHead(key, mode) {
  const g = groups[key], pl = g.place;
  const tab = (m, label) => `<button data-mode="${m}" class="${mode === m ? 'on' : ''}">${label}</button>`;
  return `<button class="x">[esc]</button>
    <div class="cmd">&gt; <b>${pl.name.toLowerCase()}</b></div>
    <div class="sub">${pl.region.toLowerCase()}${pl.zone ? ' · area only' : ''}</div>
    <div class="tabs">${tab('photos', `photos ${g.items.length}`)}${tab('info', '[i] about')}</div>`;
}

function wirePanel(key) {
  const p = $('#panel');
  p.querySelector('.x').onclick = closePanel;
  p.querySelector('.tabs').onclick = (e) => {
    const b = e.target.closest('[data-mode]'); if (!b) return;
    b.dataset.mode === 'info' ? openInfo(key, false) : openPhotos(key, false);
  };
  p.classList.add('open');
}

function openPhotos(key, fly = true) {
  const g = groups[key];
  $('#panel').innerHTML = panelHead(key, 'photos') + `
    <div class="grid big">${g.items.map((m) => `<button data-id="${m.id}">${mediaHTML(m)}${m.visibility === 'private' ? '<span class="p">private</span>' : ''}</button>`).join('')}</div>
    <ol>${g.items.map((m) => `<li><span data-jump="${m.id}">${fmtDay(m.date).toLowerCase()}</span><span>${m.caption}</span></li>`).join('')}</ol>
    ${g.place.zone ? '<div class="note">// private zone: shown at suburb level</div>' : ''}`;
  wirePanel(key);
  $('#panel .grid').onclick = (e) => {
    const b = e.target.closest('[data-id]'); if (!b) return;
    openLightbox(g.items, g.items.findIndex((m) => m.id === b.dataset.id), lbMeta);
  };
  $('#panel ol').onclick = (e) => { const j = e.target.closest('[data-jump]'); if (j) showMoment(j.dataset.jump); };
  if (fly) flyToPlace(g.place);
}

// Live lookup: Wikipedia summary + photos from Wikimedia Commons.
// (In the real site this is fetched once per place on the server and cached in D1.)
const infoCache = {};
const WIKI = 'https://en.wikipedia.org';
const COMMONS = 'https://commons.wikimedia.org/w/api.php?format=json&origin=*';
const SKIP = /map|locator|logo|flag|coat.of.arms|seal|diagram|chart|icon|\.svg|\.tif|\.pdf/i;
// Nearby uploads include plenty of non-scenery; skip the usual suspects.
const DULL = /library|workshop|meeting|car.?park|parking|church|school|station|office|interior|plaque|sign\b|memorial|grave|council/i;

function rankPhotos(articleTitles, nearby, pl) {
  const name = pl.name.toLowerCase().split(',')[0];
  const nearbyTitles = nearby.map((g) => g.title).filter((t) => !DULL.test(t));
  const named = nearbyTitles.filter((t) => t.toLowerCase().includes(name));
  const rest = nearbyTitles.filter((t) => !t.toLowerCase().includes(name));
  const perSeries = {};
  return [...new Set([...articleTitles, ...named, ...rest])]
    .filter((t) => /\.(jpe?g|png|webp)$/i.test(t) && !SKIP.test(t))
    .filter((t) => {
      // At most two from any numbered series ("2024-10-04 Palm Beach 01.jpg", "... 02.jpg").
      const k = t.replace(/[\s_]*\d+\.\w+$/, '');
      return (perSeries[k] = (perSeries[k] || 0) + 1) <= 2;
    })
    .slice(0, 6);
}
const stripTags = (h) => (h || '').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();

async function fetchInfo(pl) {
  const t = encodeURIComponent(pl.wiki.replace(/ /g, '_'));
  const [sum, media, near] = await Promise.all([
    fetch(`${WIKI}/api/rest_v1/page/summary/${t}`).then((r) => r.json()),
    fetch(`${WIKI}/api/rest_v1/page/media-list/${t}`).then((r) => r.json()).catch(() => ({ items: [] })),
    fetch(`${COMMONS}&action=query&list=geosearch&gscoord=${pl.lat}|${pl.lng}&gsradius=${pl.zone ? 4000 : 6000}&gsnamespace=6&gslimit=30`)
      .then((r) => r.json()).catch(() => ({})),
  ]);
  // The article's own photos first, then nearby photos that name the place, then other nearby ones.
  const titles = rankPhotos(
    (media.items || []).filter((i) => i.type === 'image').map((i) => i.title),
    (near.query && near.query.geosearch) || [], pl);
  let photos = [];
  if (titles.length) {
    const ii = await fetch(`${COMMONS}&action=query&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=1400&titles=${encodeURIComponent(titles.join('|'))}`).then((r) => r.json());
    photos = Object.values(ii.query.pages)
      .filter((p) => p.imageinfo)
      .sort((a, b) => titles.indexOf(a.title) - titles.indexOf(b.title))
      .map((p) => {
        const info = p.imageinfo[0], md = info.extmetadata || {};
        const artist = stripTags(md.Artist && md.Artist.value) || 'unknown';
        const license = stripTags(md.LicenseShortName && md.LicenseShortName.value);
        return {
          kind: 'photo', src: info.thumburl, page: info.descriptionurl,
          caption: stripTags(md.ImageDescription && md.ImageDescription.value).slice(0, 140) || p.title.replace(/^File:|\.\w+$/g, ''),
          credit: `${artist.slice(0, 40)}${license ? ' · ' + license.toLowerCase() : ''} · wikimedia commons`,
        };
      });
  }
  return { title: sum.title, desc: sum.description, extract: sum.extract, url: sum.content_urls && sum.content_urls.desktop.page, photos };
}

async function openInfo(key, fly = true) {
  const pl = groups[key].place;
  $('#panel').innerHTML = panelHead(key, 'info') + `<div class="loading">fetching wikipedia<i></i></div>`;
  wirePanel(key);
  if (fly) flyToPlace(pl);
  let d;
  try { d = infoCache[key] ||= await fetchInfo(pl); }
  catch { infoCache[key] = undefined; d = null; }
  if (!$('#panel').classList.contains('open') || !$('#panel .tabs [data-mode="info"].on') || $('#panel .cmd b').textContent !== pl.name.toLowerCase()) return;
  $('#panel').innerHTML = panelHead(key, 'info') + (d ? `
    ${d.desc ? `<div class="desc">${d.desc.toLowerCase()}</div>` : ''}
    <p class="blurb">${d.extract}</p>
    <a class="src" href="${d.url}" target="_blank" rel="noopener">-- read more on wikipedia ↗</a>
    ${d.photos.length ? `<div class="grid big ext">${d.photos.map((p, i) => `<button data-ext="${i}"><img src="${p.src}" alt="" loading="lazy"></button>`).join('')}</div>
    <div class="note">// photos from wikimedia commons, credited when opened</div>` : ''}`
    : `<div class="note">// couldn't reach wikipedia right now</div>`);
  wirePanel(key);
  const ext = $('#panel .ext');
  if (ext) ext.onclick = (e) => {
    const b = e.target.closest('[data-ext]'); if (!b) return;
    openLightbox(d.photos, +b.dataset.ext, lbMeta);
  };
}
function closePanel() { $('#panel').classList.remove('open'); }

// ---- views, keys, spin ----
let spinning = false, raf;
function spin() {
  if (!spinning) return;
  const c = map.getCenter();
  map.setCenter([c.lng + 0.08, c.lat]);
  raf = requestAnimationFrame(spin);
}
function stopSpin() { spinning = false; cancelAnimationFrame(raf); $('[data-k="r"]').classList.remove('on'); }
function go(k) {
  if (k === 'r') {
    if (spinning) return stopSpin();
    closePanel();
    map.easeTo({ zoom: 1.6, duration: 800 });
    spinning = true; $('[data-k="r"]').classList.add('on');
    setTimeout(spin, 850);
    return;
  }
  stopSpin(); closePanel();
  map.flyTo({ ...VIEWS[k], duration: 3200, curve: 1.6 });
}
document.querySelector('.keys').onclick = (e) => { const b = e.target.closest('[data-k]'); if (b) go(b.dataset.k); };
document.addEventListener('keydown', (e) => {
  if (document.querySelector('.lb.open') || view !== 'map') return;
  if (e.key === 'Escape') closePanel();
  if (VIEWS[e.key] || e.key === 'r') go(e.key);
});
map.on('mousedown', stopSpin); map.on('touchstart', stopSpin);


// ---- timeline ----
let view = 'map', cat = 'all';
const fmtMonthYear = (d) => d.toLocaleDateString('en-AU', { month: 'long', year: 'numeric' }).toLowerCase();

function renderFilters() {
  $('#filters').innerHTML = CATEGORIES.map((c) =>
    `<button data-cat="${c.key}" class="${c.key === cat ? 'on' : ''}">${c.label.toLowerCase()}</button>`).join('');
}
function renderTimeline() {
  $('#tl').innerHTML = groupByMonth(filterMoments(cat)).map((g) => `
    <div class="mh"><b>${fmtMonthYear(g.date)}</b><span>${g.items.length}</span></div>
    ${g.items.map((m) => {
      // Clamp very tall shots so one photo never fills more than about a screen.
      const ratio = Math.max(m.w / m.h, 0.8);
      const tags = [m.visibility === 'private' && 'private', m.food].filter(Boolean).map((t) => `[${t}]`).join(' ');
      return `<article class="mo" id="m-${m.id}">
        <button class="media" data-id="${m.id}" style="aspect-ratio:${ratio}">${mediaHTML(m)}</button>
        <div class="line">
          <span class="d">${fmtDay(m.date).toLowerCase()}</span>
          <button class="pl" data-place="${m.placeKey}">${m.place.name.toLowerCase()}${m.approx ? ' ≈' : ''}</button>
          <span class="c">${m.caption}${tags ? `<span class="t">${tags}</span>` : ''}</span>
        </div>
      </article>`;
    }).join('')}`).join('') + `<div class="end">that's everything<i></i></div>`;
}
$('#timeline').addEventListener('click', (e) => {
  const f = e.target.closest('[data-cat]');
  if (f) { cat = f.dataset.cat; renderFilters(); renderTimeline(); $('#timeline').scrollTop = 0; return; }
  const p = e.target.closest('[data-place]');
  if (p) { setView('map'); openPhotos(p.dataset.place); return; }
  const m = e.target.closest('.media');
  if (m) {
    const list = filterMoments(cat);
    openLightbox(list, list.findIndex((x) => x.id === m.dataset.id),
      (x, i, n) => `<span>${x.caption}</span><span class="m">${fmtDay(x.date).toLowerCase()} ${x.date.getFullYear()} · ${x.place.name.toLowerCase()} · ${i + 1}/${n}</span>`);
  }
});

function setView(v) {
  view = v;
  document.querySelectorAll('nav [data-view]').forEach((b) => b.classList.toggle('on', b.dataset.view === v));
  $('#timeline').hidden = v !== 'timeline';
  document.body.classList.toggle('tl-on', v === 'timeline');
  if (v === 'timeline') stopSpin();
  history.replaceState(null, '', '#' + v);
}
document.querySelector('nav').onclick = (e) => { const b = e.target.closest('[data-view]'); if (b) setView(b.dataset.view); };

// From the map panel: jump to a moment in the timeline.
function showMoment(id) {
  if (cat !== 'all' && !filterMoments(cat).some((m) => m.id === id)) { cat = 'all'; renderFilters(); renderTimeline(); }
  setView('timeline');
  const el = document.getElementById('m-' + id);
  el.scrollIntoView({ block: 'start' });
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 1600);
}

renderFilters(); renderTimeline();

// Deep links for review: #timeline, #map, #w, #<place> (my photos) or #i:<place> (about).
{
  const k = location.hash.slice(1);
  if (k === 'timeline') setView('timeline');
  map.once('idle', () => {
    if (VIEWS[k]) map.jumpTo(VIEWS[k]);
    if (groups[k]) openPhotos(k);
    if (k.startsWith('i:') && groups[k.slice(2)]) openInfo(k.slice(2));
  });
}
</script>
